name: AI Job Hunter

on:
  schedule:
    # Fast run every 4 hours
    - cron: '*/240 * * * *'
    # Extended run daily at 06:00 UTC (catch everything else)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast
          - extended

jobs:
  run-job-hunter:
    runs-on: windows-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Job Hunter (Fast Mode)
      if: github.event_name == 'schedule' && github.event.schedule != '0 6 * * *' || github.event.inputs.mode == 'fast'
      run: npx ts-node src/index.ts
    
    - name: Run Job Hunter (Extended Mode)
      if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * *' || github.event.inputs.mode == 'extended'
      run: npx ts-node src/index.ts --extended
    
    - name: Commit logs
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -f job-matches/ sent_jobs.log
        git diff-index --quiet HEAD || git commit -m "Update job matches"
        git push
